<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn Spotlight — design preview</title>
    <style>
      body { margin: 0; min-height: 100vh; background: #e5e3de; color: #27322e; font-family: 'Avenir Next', 'Trebuchet MS', sans-serif; }
      .page { max-width: 850px; min-height: 75vh; margin: 65px auto; padding: 34px; border-radius: 10px; background: #fff; }
      .line { height: 15px; margin: 22px 0; border-radius: 4px; background: #eeede8; }
      .reopen { position: fixed; right: 20px; bottom: 20px; padding: 10px 14px; border: 0; border-radius: 8px; background: #263b38; color: #fff; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main class="page"><h1>Course content</h1><div class="line"></div><div class="line"></div><div class="line"></div></main>
    <button class="reopen" id="reopen" type="button">Open Spotlight</button>
    <script type="module" src="/src/preview.jsx"></script>
  </body>
</html>
